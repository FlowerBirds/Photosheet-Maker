<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Photosheet-Maker · 证件照排版工具</title>
  <link rel="stylesheet" href="css/style.css" />
  <!-- Cropper.js CSS via CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.css" />
</head>
<body>
  <header class="app-header">
    <h1>📐 Photosheet-Maker</h1>
    <nav class="mode-tabs" role="tablist">
      <button id="tab-photo" class="tab tab-active" role="tab">证件照</button>
      <button id="tab-card"  class="tab"           role="tab">卡片</button>
    </nav>
    <div class="header-actions">
      <button id="btn-reupload" class="btn-secondary" hidden>重新上传</button>
      <button id="btn-recrop"   class="btn-secondary" hidden>重新裁剪</button>
      <button id="btn-export"   class="btn-primary"   disabled>导出图片</button>
    </div>
  </header>

  <main class="container">
    <!-- Control panel (left on desktop, top on mobile) -->
    <aside class="control-panel">
      <!-- ① Upload -->
      <section class="card" id="upload-section">
        <h2>① 上传照片</h2>
        <input type="file" id="file-input" accept="image/jpeg,image/png,image/webp" />
        <p class="hint">支持 JPG / PNG / WebP，最大 20MB</p>
      </section>

      <!-- ② Crop + Rotate (visible only after upload) -->
      <section class="card" id="crop-section" hidden>
        <h2>② 裁剪与旋转</h2>
        <div class="crop-container">
          <img id="crop-image" alt="待裁剪图片" />
        </div>
        <div class="crop-actions">
          <button id="btn-rotate-left"  class="btn-secondary">↺ 左旋转</button>
          <button id="btn-rotate-right" class="btn-secondary">↻ 右旋转</button>
          <button id="btn-finish-crop"  class="btn-primary">完成裁剪</button>
        </div>
      </section>

      <!-- ③ Settings (visible after cropping) -->
      <section class="card" id="settings-section" hidden>
        <h2>③ 排版设置</h2>

        <label>目标尺寸
          <select id="select-photo-size"></select>
        </label>

        <label>相纸尺寸
          <select id="select-paper-size"></select>
        </label>

        <label>输出 DPI
          <select id="select-dpi"></select>
        </label>

        <fieldset>
          <legend>缩放（仅照片）</legend>
          <div class="slider-row">
            <label for="zoom">倍率</label>
            <input type="range" id="zoom" min="0" max="2" step="0.01" value="1" />
            <span class="slider-value" id="zoom-val">1.00×</span>
          </div>
          <p class="hint">不影响排版；超出相纸部分不显示/不导出。</p>
        </fieldset>

        <fieldset>
          <legend>裁剪线</legend>
          <label class="toggle-row">
            <input type="checkbox" id="show-crop-marks" checked />
            <span>显示并导出裁剪线</span>
          </label>
        </fieldset>

        <fieldset>
          <legend>底部水印</legend>
          <label class="toggle-row">
            <input type="checkbox" id="show-footer" checked />
            <span>显示并导出底部水印</span>
          </label>
        </fieldset>

        <fieldset>
          <legend>边距（mm）</legend>
          <div class="slider-row">
            <label for="margin-top">上</label>
            <input type="range" id="margin-top"    min="0" max="20" value="5" />
            <span class="slider-value" id="margin-top-val">5</span>
          </div>
          <div class="slider-row">
            <label for="margin-bottom">下</label>
            <input type="range" id="margin-bottom" min="0" max="20" value="5" />
            <span class="slider-value" id="margin-bottom-val">5</span>
          </div>
          <div class="slider-row">
            <label for="margin-left">左</label>
            <input type="range" id="margin-left"   min="0" max="20" value="5" />
            <span class="slider-value" id="margin-left-val">5</span>
          </div>
          <div class="slider-row">
            <label for="margin-right">右</label>
            <input type="range" id="margin-right"  min="0" max="20" value="5" />
            <span class="slider-value" id="margin-right-val">5</span>
          </div>
        </fieldset>

        <fieldset>
          <legend>间距（mm）</legend>
          <div class="slider-row">
            <label for="gap-h">横向</label>
            <input type="range" id="gap-h" min="0" max="20" value="2" />
            <span class="slider-value" id="gap-h-val">2</span>
          </div>
          <div class="slider-row">
            <label for="gap-v">竖向</label>
            <input type="range" id="gap-v" min="0" max="20" value="2" />
            <span class="slider-value" id="gap-v-val">2</span>
          </div>
        </fieldset>
      </section>

      <!-- Card editor (visible only in CARD mode) -->
      <section class="card" id="card-editor-section" hidden>
        <h2>卡片尺寸</h2>
        <label>预设
          <select id="select-card-size"></select>
        </label>
        <div class="orient-row">
          <label class="orient-label">
            <input type="radio" name="card-orientation" value="portrait" checked />
            <span>纵向</span>
          </label>
          <label class="orient-label">
            <input type="radio" name="card-orientation" value="landscape" />
            <span>横向</span>
          </label>
        </div>
        <div class="orient-row arrange-orient-row">
          <span class="orient-label-title">排版方向</span>
          <label class="orient-label">
            <input type="radio" name="card-arrange-orientation" value="portrait" checked />
            <span>纵向</span>
          </label>
          <label class="orient-label">
            <input type="radio" name="card-arrange-orientation" value="landscape" />
            <span>横向</span>
          </label>
        </div>
        <div class="custom-size-row" id="custom-card-size" hidden>
          <div class="slider-row">
            <label for="card-w">宽</label>
            <input type="range" id="card-w" min="5" max="200" step="1" value="90" />
            <span class="slider-value" id="card-w-val">90</span>
          </div>
          <div class="slider-row">
            <label for="card-h">高</label>
            <input type="range" id="card-h" min="5" max="200" step="1" value="54" />
            <span class="slider-value" id="card-h-val">54</span>
          </div>
        </div>

        <!-- Card image crop phase (shown when user picks an image) -->
        <section class="card" id="card-crop-section" hidden>
          <h2>裁剪图片</h2>
          <div class="crop-container">
            <img id="card-crop-img" alt="待裁剪图片" />
          </div>
          <div class="crop-actions">
            <button id="btn-card-crop-rotate-left"  class="btn-secondary">↺ 左旋转</button>
            <button id="btn-card-crop-rotate-right" class="btn-secondary">↻ 右旋转</button>
            <button id="btn-card-crop-finish"       class="btn-primary">完成裁剪</button>
            <button id="btn-card-crop-cancel"       class="btn-secondary">取消</button>
          </div>
        </section>

        <!-- Design phase -->
        <div id="card-design-phase">
          <h2>卡片边框</h2>
          <div class="slider-row">
            <label for="card-border-width">宽</label>
            <input type="range" id="card-border-width" min="0" max="3" step="0.1" value="0.1" />
            <span class="slider-value" id="card-border-width-val">0.1</span>
          </div>
          <div class="color-row">
            <label for="card-border-color">颜色</label>
            <input type="color" id="card-border-color" value="#888888" />
          </div>

          <h2>设计</h2>
          <div class="card-actions">
            <button id="btn-add-text"  class="btn-secondary">＋ 添加文本</button>
            <button id="btn-add-image" class="btn-secondary">＋ 添加图片</button>
            <button id="btn-add-rect"  class="btn-secondary">＋ 添加矩形</button>
            <input  type="file" id="card-image-input" accept="image/jpeg,image/png,image/webp" class="visually-hidden" />
          </div>
          <div id="card-element-list" class="element-list"></div>

          <!-- Properties panel: visible only when an element is selected. -->
          <section class="card properties-section" id="card-properties-section" hidden>
            <h2>属性</h2>

            <!-- Text element: font-size slider -->
            <div class="slider-row" id="prop-font-size" hidden>
              <label for="prop-font-size-input">字号</label>
              <input type="range" id="prop-font-size-input" min="2" max="40" step="0.5" />
              <span class="slider-value" id="prop-font-size-val">5 mm</span>
            </div>

            <!-- Image element: width / height sliders + aspect lock -->
            <div id="prop-image-dims" hidden>
              <div class="slider-row">
                <label for="prop-w-input">宽</label>
                <input type="range" id="prop-w-input" min="1" max="200" step="0.5" />
                <span class="slider-value" id="prop-w-val">10 mm</span>
              </div>
              <div class="slider-row">
                <label for="prop-h-input">高</label>
                <input type="range" id="prop-h-input" min="1" max="200" step="0.5" />
                <span class="slider-value" id="prop-h-val">10 mm</span>
              </div>
              <div class="aspect-row">
                <button id="prop-aspect-toggle" class="btn-secondary aspect-toggle" type="button">🔗</button>
                <span class="hint">锁定比例</span>
              </div>
            </div>

            <!-- Rect element: width / height / border / fill -->
            <div id="prop-rect-dims" hidden>
              <div class="slider-row">
                <label for="prop-rect-w-input">宽</label>
                <input type="range" id="prop-rect-w-input" min="1" max="200" step="0.5" />
                <span class="slider-value" id="prop-rect-w-val">15 mm</span>
              </div>
              <div class="slider-row">
                <label for="prop-rect-h-input">高</label>
                <input type="range" id="prop-rect-h-input" min="1" max="200" step="0.5" />
                <span class="slider-value" id="prop-rect-h-val">15 mm</span>
              </div>
              <div class="slider-row">
                <label for="prop-border-width-input">边框</label>
                <input type="range" id="prop-border-width-input" min="0" max="10" step="0.1" />
                <span class="slider-value" id="prop-border-width-val">2 mm</span>
              </div>
              <div class="color-row">
                <label for="prop-border-color">边框色</label>
                <input type="color" id="prop-border-color" value="#888888" />
              </div>
              <div class="color-row">
                <label for="prop-fill-color">填充色</label>
                <input type="color" id="prop-fill-color" value="#ffffff" />
              </div>
            </div>
          </section>

          <button id="btn-complete-design" class="btn-primary">完成设计 →</button>
        </div>

        <!-- Arrange phase -->
        <div id="card-arrange-phase" hidden>
          <button id="btn-redesign" class="btn-secondary">← 重新设计</button>
        </div>
      </section>
    </aside>

    <!-- Preview area (right on desktop, bottom on mobile) -->
    <section class="preview-area">
      <div class="preview-wrapper">
        <canvas id="preview-canvas"></canvas>
        <canvas id="card-canvas" hidden></canvas>
      </div>

      <div class="info-panel" id="info-panel">
        <p>容纳：<span id="info-count">—</span> 张</p>
        <p>输出：<span id="info-size">—</span></p>
        <p id="info-warning" class="warning" hidden></p>
      </div>
    </section>
  </main>

  <!-- Toast region -->
  <div id="toast" class="toast" hidden></div>

  <!-- Cropper.js + our modules -->
  <script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
